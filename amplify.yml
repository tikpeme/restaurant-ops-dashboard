version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # The build image already runs Node 20.20.2 and npm 10.8.2
            # (confirmed in the build log), so no install or pin steps are needed.
            # Node comes from frontend/.nvmrc; peer-dep handling from frontend/.npmrc.
            - node --version
            - npm --version
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
